<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GD Impossible Levels</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="kicker">Impossible Geometry Dash List</p>
          <h1>GD Impossible Levels</h1>
        </div>
        <div id="auth-panel" class="auth-panel">
          <div id="guest-actions" class="auth-actions">
            <button id="show-create-account" class="secondary-btn">Create account</button>
            <button id="show-login" class="secondary-btn">Log in</button>
          </div>
          <div id="user-bar" class="user-bar hidden">
            <span id="current-user-label">Admin</span>
            <button id="logout-btn" class="danger-btn">Log out</button>
          </div>
        </div>
      </header>

      <section id="account-forms" class="card account-card">
        <div class="tab-row">
          <button class="tab-button active" data-tab="create-tab">Create account</button>
          <button class="tab-button" data-tab="login-tab">Log in</button>
        </div>

        <div id="create-tab" class="form-panel active-panel">
          <form id="create-account-form">
            <div class="field-row">
              <label>Username
                <input type="text" id="create-username" maxlength="24" required />
              </label>
              <label>Password
                <input type="password" id="create-password" maxlength="32" required />
              </label>
            </div>
            <button type="submit" class="primary-btn">Create account</button>
          </form>
        </div>

        <div id="login-tab" class="form-panel">
          <form id="login-form">
            <div class="field-row">
              <label>Username
                <input type="text" id="login-username" maxlength="24" required />
              </label>
              <label>Password
                <input type="password" id="login-password" maxlength="32" required />
              </label>
            </div>
            <button type="submit" class="primary-btn">Log in</button>
          </form>
        </div>
      </section>

      <section id="message-box" class="message-box hidden"></section>

      <main class="content-grid">
        <section class="card">
          <div class="section-header">
            <h2>Submit a level</h2>
          </div>

          <form id="level-submit-form" class="level-form">
            <div class="field-row two-up">
              <label>Level name
                <input type="text" id="level-name" maxlength="80" required />
              </label>
              <label>Creator
                <input type="text" id="level-creator" maxlength="50" required />
              </label>
            </div>

            <div class="field-row two-up">
              <label>Thumbnail URL (PNG/GIF/JPG)
                <input type="url" id="thumbnail-url" placeholder="https://example.com/image.png" required />
              </label>
              <label>YouTube video ID
                <input type="text" id="video-id" maxlength="64" placeholder="dQw4w9WgXcQ" required />
              </label>
            </div>

            <div class="field-row three-up">
              <label>Level length (seconds)
                <input type="number" id="level-length" min="1" step="1" required />
              </label>
              <label>FPS
                <input type="number" id="fps" min="1" step="1" required />
              </label>
              <label>CPS
                <input type="number" id="cps" min="1" step="0.1" required />
              </label>
            </div>

            <div class="field-row three-up">
              <label>Difficulty
                <input type="number" id="difficulty" min="1" max="100" step="1" required />
              </label>
              <label>Best known run
                <input type="text" id="best-run" maxlength="60" required />
              </label>
              <label>Game mode
                <input type="text" id="game-mode" maxlength="30" value="Normal" required />
              </label>
            </div>

            <label>Description
              <textarea id="description" rows="5" maxlength="500" required></textarea>
            </label>

            <label>Notes / extra stats
              <textarea id="extra-stats" rows="4" maxlength="500" placeholder="Examples: spikes, speed changes, ship sections, side effects..."></textarea>
            </label>

            <button type="submit" class="primary-btn">Submit level</button>
          </form>
        </section>

        <aside id="admin-panel" class="card admin-panel hidden">
          <div class="section-header">
            <h2>Pending review</h2>
          </div>
          <div id="pending-list" class="pending-list"></div>
        </aside>
      </main>

      <section class="card">
        <div class="section-header">
          <h2>Approved levels</h2>
        </div>
        <div id="levels-grid" class="levels-grid"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
